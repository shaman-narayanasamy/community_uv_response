---
output_dir: "/path/to/project/output/community_uv_response"
annotation_table: "/path/to/project/metadata/rmag_gene_annotations.tsv"
sample_metadata: "/path/to/multiomics_pipeline/metadata/PRJEB79569_multiomics_samples.tsv"
bam_manifest: "/path/to/project/metadata/rmag_metagenomic_bams.tsv"
rmag_fasta: "/path/to/project/output/dereplication/all_dereplicated_rMAGs.fa"
